name: Performer Gallery Sync
description: Automatically download performer images from stashdb or other stash-boxes. Add the [Performer Gallery Sync] tag to a performer and it will create a gallery of images from that stash-box database. Apply the tag [Set Profile Pic] to an image to set it as the profile image of that performer. Note you will need to configure the download path and add this as a path under settings > library
version: 0.3
url: https://github.com/juicyjohnnyiii/claude-stash-plugins
exec:
  - python
  - "{pluginDir}/performer-gallery-sync.py"
interface: raw
ui:
  javascript:
    - performer-gallery-sync-button.js
settings:
  path:
    displayName: Download parent folder
    description: Download location for files, note this should be in a different folder to stash and in a folder covered by stash. You may need to create a new library path to cover this directory.
    type: STRING
  runPerformerScraper:
    displayName: Run stash scrapers on profile urls
    description: Run scrapers on profile urls
    type: BOOLEAN

hooks:
  - name: modify performer
    description: Download galleries on performer update if the [performer gallery] tag is applied
    triggeredBy:
      - Performer.Update.Post
  - name: image add
    description: Add images
    triggeredBy:
      - Image.Create.Post
  - name: set profile images
    description: Set profile images py adding the [Set Profile Pic] tag to the image, there must be exactly 1 performer tagged on the image.
    triggeredBy:
      - Image.Update.Post
  - name: exclude deleted images
    description: When an image is deleted in Stash, record it so future syncs don't re-download it.
    triggeredBy:
      - Image.Destroy.Post

tasks:
  - name: "Process Performers"
    description: Fetch performer images for performers with the [performer gallery] tag
    defaultArgs:
      mode: processPerformers
  - name: "relink missing images"
    description: reprocess missing images
    defaultArgs:
      mode: processImages
