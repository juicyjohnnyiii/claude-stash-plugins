name: Stash Performer Image Cropper
description: Fork of DogmaDragon's cropper - fixes it targeting/positioning against whichever image (primary or secondary) is currently active, and saving to the correct field (image vs alt_image custom field) accordingly.
version: 0.4.0
url: https://github.com/juicyjohnnyiii/claude-stash-plugins
ui:
  requires:
  - stashUserscriptLibrary7dJx1qPFork
  css:
  - https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css
  javascript:
  - https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.js
  - stashPerformerImageCropper.js
